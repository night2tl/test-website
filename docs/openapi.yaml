openapi: 3.0.3
info:
  title: Test website API
  version: 1.0.0
paths:
  /api/products:
    get:
      summary: List products in the public catalog
      description: Use this when someone asks what plans or services are for sale. Optionally filter by category (plans or services).
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, enum: [plans, services] } }
  /api/products/{id}:
    get:
      summary: Get one product by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
  /api/search:
    get:
      summary: Search products by name
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
